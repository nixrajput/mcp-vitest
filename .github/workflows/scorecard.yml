name: Scorecard analysis

# OpenSSF Scorecard: supply-chain posture of the repo itself (branch protection,
# pinned actions, token permissions). Push/schedule only - never a PR gate.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # publish results to the OpenSSF API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # No floating v2 tag is published for this action, so pin the minor.
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
