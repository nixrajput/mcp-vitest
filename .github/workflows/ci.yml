name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Run available scripts
        run: |
          for s in lint ts:check test build; do
            if jq -e --arg s "$s" '.scripts[$s]' package.json >/dev/null; then
              npm run "$s"
            fi
          done
      - name: Verify publish contents
        run: npm pack --dry-run

  # package.json declares engines.node >=20, so the floor has to be exercised.
  # Kept as its own job rather than a matrix on `build`: a matrix would rename
  # the check to "build (24)" and break the required status check on main.
  build-node-floor:
    name: build (node 20 floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint, typecheck, test
        run: |
          for s in lint ts:check test; do
            if jq -e --arg s "$s" '.scripts[$s]' package.json >/dev/null; then
              npm run "$s"
            fi
          done

  # Advisory only: publishes the size/bench/health/coverage numbers to the PR
  # summary. Never gates - do not add this to the required checks.
  report:
    name: report (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Full report
        run: |
          {
            echo '## mcp-vitest report'
            echo '```'
            npm run report --silent 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
